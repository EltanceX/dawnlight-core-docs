name: Deploy documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run test:content
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: site-build-report
          path: |
            artifacts/w2/site-build.json
            artifacts/w2/browser-results.json
            site/.vitepress/generated/output-manifest.json
            metadata/examples-validation.json
            metadata/w6-examples-validation.json
            metadata/w6-runtime.json
            metadata/reference-examples.json
            metadata/reference-inputs.json
            site/public/downloads/reference/coverage.json
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked static artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
