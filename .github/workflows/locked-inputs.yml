name: Locked authoring inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Acquire pinned private tool asset
        env:
          GH_TOKEN: ${{ secrets.DAWNLIGHT_ASSETS_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:GH_TOKEN) { throw 'Configure DAWNLIGHT_ASSETS_TOKEN with read access to EltanceX/DawnlightCore releases.' }
          node scripts/acquire-tool.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/restore-upstream.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify restored source bytes
        run: node scripts/verify-upstream.mjs
      - name: Validate canonical authoring inputs
        run: npm run authoring:check
      - name: Reproduce public reference receipts
        run: npm run reference:verify
      - name: Reproduce independent pack branch receipts
        run: npm run examples:w6:verify
      - name: Reproduce effect and diagnostic receipts
        run: npm run examples:w7:verify
      - name: Verify corruption rejection and Windows checkout
        run: node --test scripts/tests/locked-inputs.test.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: locked-input-evidence
          path: |
            artifacts/w3
            artifacts/w5
            artifacts/w6/validation
            artifacts/w7/validation
            artifacts/w7/diagnostics
